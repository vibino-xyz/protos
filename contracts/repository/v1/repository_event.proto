syntax = "proto3";

package repository.v1;
option go_package = "github.com/vibino-xyz/protos/contracts/build/go/repository/v1;repositoryv1";

enum Provider {
    UNKNOWN = 0;
    GITHUB = 1;
    GITLAB = 2;
    BITBUCKET = 3;
}

enum EventType {
    UNKNOWN_EVENT = 0;
    FULL_INDEX = 1;
    INCREMENTAL_INDEX = 2;
}

message RepositoryEventMessage {
    Provider provider = 1;
    EventType event_type = 2;
    int64 repository_id = 3;
    string repo_full_name = 4;
    string default_branch = 5;
    string clone_url = 6;
}
